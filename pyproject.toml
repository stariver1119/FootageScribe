[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footage-scribe"
version = "0.1.0"
description = "Label raw footage, generate timestamped transcripts, and discuss edits with your AI agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FootageScribe contributors" }]
keywords = [
  "video-editing",
  "vlog",
  "whisper",
  "transcription",
  "premiere-pro",
  "ai-agent",
  "raw-footage",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
]

[project.scripts]
footage-scribe = "footage_scribe.cli:main"

[tool.setuptools.packages.find]
include = ["footage_scribe*"]

[tool.setuptools.package-data]
footage_scribe = ["rules/*.json"]
